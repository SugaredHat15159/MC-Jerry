name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Resolve newest NeoForge 21.1.x and ModDevGradle 2.0.x
        run: |
          NEO=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE '<version>21\.1\.[0-9]+</version>' | sed -E 's/<\/?version>//g' | sort -V | tail -1)
          MDG=$(curl -s https://maven.neoforged.net/releases/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml | grep -oE '<version>2\.0\.[0-9]+</version>' | sed -E 's/<\/?version>//g' | sort -V | tail -1)
          echo "NeoForge $NEO / ModDevGradle $MDG"
          echo "NEO=$NEO" >> $GITHUB_ENV
          echo "MDG=$MDG" >> $GITHUB_ENV
      - name: Build
        run: gradle build -Pneo_version=$NEO -Pmoddev_version=$MDG --stacktrace
      - name: Smoke test - boot a dedicated server with the mod
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\n' > run/server.properties
          (gradle runServer -Pneo_version=$NEO -Pmoddev_version=$MDG > server.log 2>&1 &)
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log; then echo "SERVER STARTED"; break; fi
            if grep -qE 'BUILD FAILED|Crash report|FATAL' server.log; then break; fi
            sleep 5
          done
          sleep 5; pkill -f 'runServer|net.neoforged' || true
          grep -iE 'jerry' server.log | tail -20
          ls -la run/config/jerry || true
          grep -q 'Done (' server.log && grep -q 'Jerry config loaded' server.log && ! grep -qiE 'Jerry config:|Exception.*jerry' server.log
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
      - uses: actions/upload-artifact@v4
        with:
          name: jerry-mod
          path: build/libs/*.jar
